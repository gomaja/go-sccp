name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: go generate
        run: |
          go install golang.org/x/tools/cmd/stringer@v0.52.0
          PATH="$(go env GOPATH)/bin:$PATH" go generate ./...
          git diff --exit-code
      - name: diff check
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          empty_tree="$(git hash-object -t tree /dev/null)"

          check_full_tree() {
            git diff --check "$empty_tree" HEAD
          }

          diff_from_ref() {
            base="$1"
            if git cat-file -e "${base}^{commit}" 2>/dev/null ||
              git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
              git diff --check "${base}...HEAD"
            else
              check_full_tree
            fi
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_from_ref "${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "$zero_sha" ]; then
            diff_from_ref "${{ github.event.before }}"
          else
            check_full_tree
          fi

  test-linux:
    name: test-linux / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', stable]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -count=1 -timeout 900s

  test-linux-race:
    name: test-linux race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go test -race
        run: go test ./... -race -count=1 -timeout 900s

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go test -bench
        run: go test -benchmem -bench . ./...

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go vet
        run: go vet ./...
      - name: cross vet
        run: |
          for target in linux/386 linux/arm linux/s390x linux/mips; do
            echo "== $target =="
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go vet ./...
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          # staticcheck v0.8.1 reads the export data of Go 1.26 at most
          # (https://github.com/dominikh/go-tools/issues/1832, fixed after
          # it); move to stable with the first release that has the fix.
          go-version: '1.26.x'
          cache: true
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  examples:
    name: examples
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          # As for lint: staticcheck v0.8.1 reads Go 1.26 export data at most
          # (https://github.com/dominikh/go-tools/issues/1832).
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: examples/go.sum
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$(go env GOPATH)/bin/staticcheck" ./...

  portability:
    name: portability / ${{ matrix.kind }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: cross-build-linux-arm64
            os: ubuntu-latest
            command: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
          - kind: cross-build-linux-riscv64
            os: ubuntu-latest
            command: GOOS=linux GOARCH=riscv64 CGO_ENABLED=0 go build ./...
          - kind: unsupported-macos
            os: macos-latest
            command: go test ./... -short -count=1
          - kind: unsupported-windows
            os: windows-latest
            command: go test ./... -short -count=1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: ${{ matrix.kind }}
        run: ${{ matrix.command }}

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: govulncheck examples
        working-directory: examples
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
